<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.78)),
    url("./images/banner.webp");
    background-size:cover;
    background-position:center;
}

div{
    width:450px;
    background:rgba(20,20,20,.96);
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    padding:35px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

input[type="radio"]{
    accent-color:#f4b400;
    margin:0 8px 25px 15px;
    transform:scale(1.2);
    cursor:pointer;
}

body{
    color:#fff;
}

input[type="text"],
input[type="email"],
textarea{
    width:100%;
    margin-top:15px;
    padding:14px 18px;
    background:#111;
    color:#fff;
    border:2px solid #333;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#999;
}

input[type="text"]:focus,
input[type="email"]:focus,
textarea:focus{
    border-color:#f4b400;
    box-shadow:0 0 15px rgba(244,180,0,.35);
}

textarea{
    resize:none;
    height:130px;
}

button{
    width:100%;
    height:55px;
    margin-top:25px;
    border:none;
    border-radius:8px;
    background:#f4b400;
    color:#000;
    font-size:17px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    transition:.35s;
}

button:hover{
    background:#ffd54f;
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(244,180,0,.45);
}

button:active{
    transform:scale(.97);
}

.p1,
.p2,
.p3{
    display:none;
    color:#ff4d4d;
    font-size:14px;
    margin-top:8px;
}

@media(max-width:500px){

    body{
        padding:15px;
    }

    div{
        width:100%;
        padding:25px;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    button{
        font-size:15px;
    }
}    </style>

    <div>
      <input type="radio" id="name" name="gender" />MR
      <input type="radio" id="female" name="gender" />MRS
      <input type="text" placeholder="enter first name" class="firstname" />
      <p class="p1">enter valid first name</p>
      <input type="text" placeholder="enter last name" class="lastname" />
      <p class="p2">enter valid last name</p>
      <input type="email" placeholder="enter your eamil" class="email" />
      <p class="p3">enter valid email</p>
      <textarea name="" id="" cols="5" placeholder="message"></textarea>
      <button>submit</button>
    </div>

    <script>
      let firstname = document.querySelector(".firstname");
      let lastname = document.querySelector(".lastname");
      let email = document.querySelector(".email");
      let btn = document.querySelector("button");
      let p1 = document.querySelector(".p1");
      let p2 = document.querySelector(".p2");
      let p3 = document.querySelector(".p3");

      btn.addEventListener("click", function () {
        if (firstname.value.length > 3) {
          p1.style.display = "none";
        } else {
          p1.style.display = "block";
        }

        if (lastname.value.length > 3) {
          p2.style.display = "none";
        } else {
          p2.style.display = "block";
        }

        if (email.value.length > 3) {
          p3.style.display = "none";
        } else {
          p3.style.display = "block";
        }

        if (
          firstname.value.length > 3 &&
          lastname.value.length > 3 &&
          email.value.length > 3
        ) {
          postdata();
        }
      });

      async function postdata() {
        let firstname = document.querySelector(".firstname").value;
        let lastname = document.querySelector(".lastname").value;
        let email = document.querySelector(".email").value;
        if (window.confirm("are you sure to send data")) {
          let data = { firstname: firstname, lastname: lastname, email: email };
          let apilink = await fetch("http://localhost:3000/users", {
            method: "POST",
            body: JSON.stringify(data),
            headers: {
              "Content-Type": "application/json",
            },
          });
        }
        window.location.reload();
      }
    </script>
  </body>
</html>
