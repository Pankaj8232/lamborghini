<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>model</title>
</head>
<body>

    <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
}

.section {
  width: 100%;
}

.section.button {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  background: #000;
  padding: 30px 20px;
  flex-wrap: wrap;
}

.section.button button {
  padding: 15px 35px;
  background: #000;
  color: #fff;
  border: 2px solid #fff;
  border-radius: 5px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: 0.3s ease;
}

.section.button button:hover {
  background: #fff;
  color: #000;
  transform: translateY(-4px);
  box-shadow: 0 10px 20px rgba(255, 255, 255, 0.3);
}

.section.button button:active {
  transform: scale(0.96);
}

.section1,
.section2,
.section3,
.section4 {
  width: 100%;
  height: 500px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #000;
  align-items: center;
  padding: 0 80px;
  position: relative;
  color: #fff;
}

.section1 {
  display: flex;
  background-image: url(./images/section1.webp);
}

.section2 {
  display: none;
  background-image: url(./images/section2.webp);
}

.section3 {
  display: none;
  background-image: url(./images/section3.webp);
}

.section4 {
  display: none;
  background-image: url(./images/section4.webp);
}

.section1::before,
.section2::before,
.section3::before,
.section4::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
}

.section1 > div,
.section2 > div,
.section3 > div,
.section4 > div {
  position: relative;
  z-index: 1;
  width: 100%;
}

.section1 h2,
.section2 h2,
.section3 h2,
.section4 h2 {
  font-size: 28px;
  font-weight: 300;
  margin: 0;
  color: #ddd;
}

.section1 h1,
.section2 h1,
.section3 h1,
.section4 h1 {
  font-size: 65px;
  line-height: 1.1;
  margin: 15px 0 35px;
  font-weight: 700;
  letter-spacing: 3px;
}

.section1 button,
.section2 button,
.section3 button,
.section4 button {
  width: 220px;
  height: 55px;
  background: #000;
  color: #fff;
  border: 2px solid #fff;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-right: 15px;
  transition: 0.3s;
}

.section1 button:hover,
.section2 button:hover,
.section3 button:hover,
.section4 button:hover {
  background: #fff;
  color: #000;
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(255, 255, 255, 0.3);
}

.section1 button a,
.section2 button a,
.section3 button a,
.section4 button a {
  text-decoration: none;
  color: inherit;
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
}

@media (max-width: 1024px) {
  .section.button {
    gap: 12px;
    padding: 20px 15px;
  }

  .section.button button {
    padding: 13px 25px;
    font-size: 13px;
  }

  .section1,
  .section2,
  .section3,
  .section4 {
    height: 480px;
    padding: 0 50px;
  }

  .section1 h2,
  .section2 h2,
  .section3 h2,
  .section4 h2 {
    font-size: 24px;
  }

  .section1 h1,
  .section2 h1,
  .section3 h1,
  .section4 h1 {
    font-size: 52px;
    margin: 12px 0 30px;
  }
}

@media (max-width: 767px) {
  .section.button {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 10px;
  }

  .section.button button {
    width: 100%;
    padding: 12px 5px;
    font-size: 10px;
    letter-spacing: 0.3px;
  }

  .section1,
  .section2,
  .section3,
  .section4 {
    height: 480px;
    min-height: 480px;
    padding: 0 25px;
    background-position: center;
  }

  .section1 > div,
  .section2 > div,
  .section3 > div,
  .section4 > div {
    text-align: left;
  }

  .section1 h2,
  .section2 h2,
  .section3 h2,
  .section4 h2 {
    font-size: 18px;
  }

  .section1 h1,
  .section2 h1,
  .section3 h1,
  .section4 h1 {
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: 1px;
    margin: 10px 0 25px;
    max-width: 100%;
  }

  .section1 button,
  .section2 button,
  .section3 button,
  .section4 button {
    width: 200px;
    height: 50px;
    margin: 0 5px 10px 0;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .section.button {
    gap: 6px;
    padding: 8px;
  }

  .section.button button {
    height: 42px;
    padding: 8px 3px;
    font-size: 9px;
    border-width: 1px;
  }

  .section1,
  .section2,
  .section3,
  .section4 {
    height: 420px;
    min-height: 420px;
    padding: 0 20px;
  }

  .section1 h2,
  .section2 h2,
  .section3 h2,
  .section4 h2 {
    font-size: 16px;
  }

  .section1 h1,
  .section2 h1,
  .section3 h1,
  .section4 h1 {
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: 0;
    margin: 8px 0 22px;
  }

  .section1 button,
  .section2 button,
  .section3 button,
  .section4 button {
    width: 190px;
    height: 48px;
    display: block;
    margin: 0 0 10px;
    font-size: 11px;
  }
}

@media (max-width: 360px) {
  .section1,
  .section2,
  .section3,
  .section4 {
    height: 400px;
    min-height: 400px;
    padding: 0 15px;
  }

  .section1 h1,
  .section2 h1,
  .section3 h1,
  .section4 h1 {
    font-size: 27px;
  }

  .section1 button,
  .section2 button,
  .section3 button,
  .section4 button {
    width: 180px;
  }
}


    </style>

     <div class="section">
    <div class="section button"><button onclick="section1b()">URUS SE PERFOMANCE</button><button
        onclick="section2b()">TEMERARIO</button><button onclick="section3b()">REVULTO</button><button
        onclick="section4b()">URUS SE</button></div>
    <div class="section1">
      <div>
        <h2>Configure your</h2>
        <h1>Urus SE Performante</h1>
        <button>START CONFIGURATION</button>
        <button><a href="./enquiry.html">ENQUIRE</a></button>
      </div>
    </div>


    <div class="section2">
      <div>
        <h2>Configure your</h2>
        <h1>TEMPERARIO</h1>
        <button>START CONFIGURATION</button>
        <button><a href="./enquiry.html">ENQUIRE</a></button>
      </div>

    </div>
    <div class="section3">
      <div>
        <h2>Configure your</h2>
        <h1>REVULTO</h1>
        <button>START CONFIGURATION</button>
        <button><a href="./enquiry.html">ENQUIRE</a></button>
      </div>
    </div>
    <div class="section4">
      <div>
        <h2>Configure your</h2>
        <h1>URUS SE</h1>
        <button>START CONFIGURATION</button>
        <button><a href="./enquiry.html">ENQUIRE</a></button>
      </div>
    </div>
  </div>

  <script>
    
let section1 = document.querySelector(".section1");
let section2 = document.querySelector(".section2");
let section3 = document.querySelector(".section3");
let section4 = document.querySelector(".section4");

function section1b() {
  section1.style.display = "block";
  section2.style.display = "none";
  section3.style.display = "none";
  section4.style.display = "none";
}

function section2b() {
  section1.style.display = "none";
  section2.style.display = "block";
  section3.style.display = "none";
  section4.style.display = "none";
}

function section3b() {
  section1.style.display = "none";
  section2.style.display = "none";
  section3.style.display = "block";
  section4.style.display = "none";
}

function section4b() {
  section1.style.display = "none";
  section2.style.display = "none";
  section3.style.display = "none";
  section4.style.display = "block";
}

  </script>


    
</body>
</html>
