<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
  </head>
  <body>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #050505;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
      }

      .container {
        width: 480px;
        max-width: 90%;
        background: #111;
        padding: 55px 50px;
        border: 1px solid #292929;
        position: relative;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: #f4b400;
      }

      .container h1 {
        color: #fff;
        font-size: 42px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 40px;
        position: relative;
      }

      .container h1::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -12px;
        width: 55px;
        height: 3px;
        background: #f4b400;
      }

      .container input {
        display: block;
        width: 100%;
        height: 55px;
        margin-bottom: 6px;
        padding: 0 18px;
        background: #050505;
        color: #fff;
        border: 1px solid #333;
        outline: none;
        border-radius: 0;
        font-size: 15px;
        letter-spacing: 0.5px;
        transition: 0.3s ease;
      }

      .container input::placeholder {
        color: #777;
        text-transform: capitalize;
      }

      .container input:focus {
        border-color: #f4b400;
        background: #0b0b0b;
      }

      .container p {
        color: #f4b400;
        font-size: 12px;
        font-weight: 600;
        margin: 6px 0 16px;
        letter-spacing: 0.5px;
      }

      .p1,
      .p2,
      .p3,
      .p4 {
        display: none;
      }

      .container button {
        width: 100%;
        height: 58px;
        margin-top: 15px;
        background: #f4b400;
        color: #000;
        border: 2px solid #f4b400;
        border-radius: 0;
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s ease;
      }

      .container button:hover {
        background: #fff;
        border-color: #fff;
        transform: translateY(-4px);
        box-shadow: 0 12px 25px rgba(255, 255, 255, 0.12);
      }

      .container button:active {
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        body {
          padding: 40px 0;
        }

        .container {
          width: 500px;
          max-width: 90%;
          padding: 45px 40px;
        }

        .container h1 {
          font-size: 36px;
          letter-spacing: 3px;
          margin-bottom: 35px;
        }

        .container input {
          height: 52px;
          font-size: 14px;
        }

        .container button {
          height: 55px;
        }
      }

      @media (max-width: 576px) {
        body {
          padding: 30px 0;
        }

        .container {
          width: 92%;
          padding: 40px 25px;
        }

        .container h1 {
          font-size: 31px;
          letter-spacing: 2px;
          margin-bottom: 32px;
        }

        .container h1::after {
          width: 45px;
          height: 2px;
        }

        .container input {
          height: 50px;
          padding: 0 14px;
          font-size: 13px;
        }

        .container p {
          font-size: 11px;
          margin-bottom: 13px;
        }

        .container button {
          height: 52px;
          font-size: 13px;
          letter-spacing: 1.5px;
        }
      }

      @media (max-width: 400px) {
        .container {
          width: 94%;
          padding: 35px 20px;
        }

        .container h1 {
          font-size: 27px;
          letter-spacing: 1.5px;
        }

        .container input {
          height: 48px;
          font-size: 12px;
        }

        .container button {
          height: 50px;
          font-size: 12px;
        }
      }

      @media (max-width: 320px) {
        .container {
          padding: 30px 16px;
        }

        .container h1 {
          font-size: 24px;
        }

        .container input {
          height: 46px;
        }

        .container button {
          height: 48px;
        }
      }
    </style>

    <div class="container">
      <h1>signup</h1>
      <input type="text" placeholder="enter your name" class="name" />
      <p class="p1">Enter valid name</p>
      <input
        type="text"
        placeholder="enter your mobile number"
        class="number"
      />
      <p class="p2">Enter valid mobile number</p>
      <input type="email" placeholder="enter your email id" class="email" />
      <p class="p3">Enter valid email</p>
      <input type="password" placeholder="enter password" class="password" />
      <p class="p4">Enter valid password</p>
      <button onclick="postproducts()">submit</button>

      <script>
        async function postproducts() {
          let name = document.querySelector(".name").value;
          let number = document.querySelector(".number").value;
          let email = document.querySelector(".email").value;
          let password = document.querySelector(".password").value;
          let p1 = document.querySelector(".p1");
          let p2 = document.querySelector(".p2");
          let p3 = document.querySelector(".p3");
          let p4 = document.querySelector(".p4");

          if (name.length > 4) {
            p1.style.display = "none";
          } else {
            p1.style.display = "block";
          }

          if (number.length === 10) {
            p2.style.display = "none";
          } else {
            p2.style.display = "block";
          }

          if (email.length > 4) {
            p3.style.display = "none";
          } else {
            p3.style.display = "block";
          }

          if (password.length > 4) {
            p4.style.display = "none";
          } else {
            p4.style.display = "block";
          }

          if (
            name.length > 4 &&
            number.length === 10 &&
            email.length > 4 &&
            password.length > 4
          ) {
            p1.style.display = "none";
            p1.style.display = "none";
            p1.style.display = "none";
            p1.style.display = "none";

            let data = {
              name: name,
              number: number,
              email: email,
              password: password,
            };
            let apilink = await fetch("http://localhost:3000/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(data),
            });
            alert("signup successfully");
            window.location.href = "home.html";
          } else {
            alert("invalid information");
          }
        }
      </script>
    </div>
  </body>
</html>
