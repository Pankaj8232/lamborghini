<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            padding:40px;
            background:
            linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.82)),
            url("https://www.lamborghini.com/sites/it-en/files/DAM/lamborghini/news/2026/08_03_miura/cover.jpg");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:auto;
            background:rgba(20,20,20,.96);
            border:1px solid rgba(255,255,255,.08);
            border-radius:18px;
            padding:40px;
            backdrop-filter:blur(10px);
            box-shadow:0 20px 50px rgba(0,0,0,.55);
        }

        h1{
            text-align:center;
            color:#f4b400;
            font-size:42px;
            margin-bottom:30px;
            letter-spacing:2px;
        }

        .addproduct{
            display:block;
            width:220px;
            height:55px;
            line-height:55px;
            margin:0 auto 35px;
            text-align:center;
            background:#f4b400;
            color:#000;
            text-decoration:none;
            border-radius:8px;
            font-size:17px;
            font-weight:700;
            letter-spacing:1px;
            transition:.35s;
        }

        .addproduct:hover{
            background:#ffd54f;
            transform:translateY(-3px);
            box-shadow:0 12px 25px rgba(244,180,0,.45);
        }

        .table-wrapper{
            width:100%;
            overflow-x:auto;
            border-radius:10px;
        }

        table{
            width:100%;
            min-width:600px;
            border-collapse:collapse;
            border-radius:10px;
            overflow:hidden;
        }

        table th{
            background:#f4b400;
            color:#000;
            padding:16px;
            font-size:17px;
        }

        table td{
            padding:15px;
            text-align:center;
            background:#181818;
            color:#fff;
            border:1px solid #333;
            word-break:break-word;
        }

        table tr:nth-child(even) td{
            background:#222;
        }

        table tr:hover td{
            background:#2d2d2d;
        }

        @media (max-width:768px){

            body{
                padding:20px 12px;
                background-attachment:scroll;
            }

            .container{
                width:100%;
                padding:25px 18px;
                border-radius:14px;
            }

            h1{
                font-size:30px;
                margin-bottom:25px;
            }

            .addproduct{
                width:100%;
                height:52px;
                line-height:52px;
                margin-bottom:25px;
                font-size:15px;
            }

            table th{
                padding:13px 15px;
                font-size:14px;
            }

            table td{
                padding:12px 15px;
                font-size:13px;
            }
        }

        @media (max-width:480px){

            body{
                padding:10px;
            }

            .container{
                padding:22px 14px;
                border-radius:12px;
            }

            h1{
                font-size:25px;
                letter-spacing:1px;
                margin-bottom:22px;
            }

            .addproduct{
                height:48px;
                line-height:48px;
                font-size:14px;
                margin-bottom:22px;
            }

            table{
                min-width:550px;
            }

            table th{
                padding:11px 13px;
                font-size:13px;
            }

            table td{
                padding:10px 13px;
                font-size:12px;
            }
        }

        @media (max-width:360px){

            body{
                padding:7px;
            }

            .container{
                padding:20px 12px;
            }

            h1{
                font-size:22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛒 Products Section</h1>

        <a href="./products.html" class="addproduct">
            + Add Products,Delete Products,Edit Products
        </a>

        <div class="table-wrapper">

            <table>

                <tr>
                    <th>date</th>
                    <th>heading</th>
                    <th>product</th>
                </tr>

            </table>

        </div>

    </div>

    <script>

        async function getprodcuts(){

            let apilink = await fetch("http://localhost:3000/products")

            let data = await apilink.json()

            let table = document.querySelector("table")

            for(let i=0; i<data.length; i++){

                table.innerHTML += `
                    <tr>
                        <td>${data[i].date}</td>
                        <td>${data[i].heading}</td>
                        <td>${data[i].img}</td>
                    </tr>
                `
            }
        }

        getprodcuts()

    </script>

</body>
</html>
