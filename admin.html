<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("https://www.lamborghini.com/sites/it-en/files/DAM/lamborghini/news/2026/08_03_miura/cover.jpg");
    background-size:cover;
    background-position:center;
}

.login-box{
    width:420px;
    background:rgba(20,20,20,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:40px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.login-box h1{
    color:#fff;
    text-align:center;
    font-size:36px;
    margin-bottom:8px;
    letter-spacing:2px;
}

.login-box h3{
    color:#bbb;
    text-align:center;
    font-weight:400;
    margin-bottom:35px;
}

input{
    width:100%;
    height:55px;
    margin-top:18px;
    padding:0 18px;
    background:#111;
    color:#fff;
    border:2px solid #333;
    border-radius:8px;
    font-size:16px;
    transition:.3s;
}

input::placeholder{
    color:#999;
}

input:focus{
    border-color:#f4b400;
    box-shadow:0 0 15px rgba(244,180,0,.35);
    outline:none;
}

.p1,
.p2{
    display:none;
    color:#ff4d4d;
    margin-top:8px;
    font-size:14px;
}

button{
    width:100%;
    height:55px;
    margin-top:30px;
    border:none;
    border-radius:8px;
    background:#f4b400;
    color:#000;
    font-size:17px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.35s;
}

button:hover{
    background:#ffd54f;
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(244,180,0,.45);
}

button:active{
    transform:scale(.97);
}
     
    </style>

    <div>

        <input type="text" placeholder="enter name" class="name">
        <p class="p1">invalid name</p>
        <input type="password" placeholder="enter password" class="password">
        <p class="p2">invalid password</p>
        <button onclick="checkuser()">submit</button>
    </div>


    <script>
        async function checkuser(params){
            let name=document.querySelector(".name").value;
            let password=document.querySelector(".password").value;
            let p1=document.querySelector(".p1")
            let p2=document.querySelector(".p2")
            if(name =="Pankaj"){
                p1.style.display="none"
                
            }else{
                p1.style.display="block"
            }

            if(password=="Pankaj@8232"){
                p2.style.display="none"
            }else{
                p2.style.display="block"
            }

        if(name=="Pankaj" && password=="Pankaj@8232"){
            p1.style.display="none"
            p2.style.display="none"
            alert("login successfull")
            window.location.href = "mainadmin.html";
        } else{
            alert("invalid credientls")
        }           
        }
    </script>


    
</body>
</html>
