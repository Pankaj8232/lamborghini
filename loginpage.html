<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>users data</title>
</head>
<body>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f5f5f5, #e9e9e9);
    color: #111;
    min-height: 100vh;
    padding: 60px 6%;
}

body::before {
    content: "USER MANAGEMENT";
    display: block;
    width: fit-content;
    margin: 0 auto 45px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #111;
    border-bottom: 4px solid #f4b400;
    padding-bottom: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
    margin-bottom: 35px;
}

table th {
    background: #f4b400;
    color: #000;
    padding: 20px 15px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
}

table td {
    padding: 18px 15px;
    text-align: center;
    color: #ddd;
    font-size: 15px;
    border-bottom: 1px solid #292929;
}

table tr {
    transition: 0.3s ease;
}

table tr:hover {
    background: #1d1d1d;
}

table tr:hover td {
    color: #f4b400;
}

#deletedata,
#editdata,
.editname,
.editnumber,
.editemail,
.editpassword {
    display: block;
    width: 100%;
    max-width: 520px;
    height: 55px;
    margin: 14px auto;
    padding: 0 18px;
    border-radius: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    outline: none;
    transition: 0.3s ease;
}

#deletedata {
    background: #111;
    color: #fff;
    border: 2px solid #111;
    cursor: pointer;
    font-weight: 700;
    margin-bottom: 40px;
}

#deletedata:hover {
    background: #f4b400;
    color: #000;
    border-color: #f4b400;
    transform: translateY(-2px);
}

.editname,
.editnumber,
.editemail,
.editpassword {
    background: #fff;
    color: #111;
    border: 2px solid #ddd;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
}

.editname::placeholder,
.editnumber::placeholder,
.editemail::placeholder,
.editpassword::placeholder {
    color: #999;
}

.editname:focus,
.editnumber:focus,
.editemail:focus,
.editpassword:focus {
    border-color: #f4b400;
    box-shadow: 0 0 0 4px rgba(244, 180, 0, 0.15);
}

#editdata {
    background: #111;
    color: #fff;
    border: 2px solid #111;
    cursor: pointer;
    font-weight: 700;
    margin-top: 20px;
}

#editdata:hover {
    background: #f4b400;
    color: #000;
    border-color: #f4b400;
    transform: translateY(-2px);
}

@media (max-width: 992px) {
    body {
        padding: 45px 4%;
    }

    body::before {
        font-size: 32px;
    }

    table th {
        font-size: 13px;
    }

    table td {
        font-size: 14px;
    }
}

@media (max-width: 768px) {
    body {
        padding: 35px 20px;
    }

    body::before {
        font-size: 27px;
        margin-bottom: 30px;
    }

    table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    table th {
        padding: 15px 12px;
        font-size: 12px;
    }

    table td {
        padding: 15px 12px;
        font-size: 13px;
    }

    #deletedata,
    #editdata,
    .editname,
    .editnumber,
    .editemail,
    .editpassword {
        max-width: 100%;
        height: 52px;
        font-size: 14px;
    }
}

@media (max-width: 576px) {
    body {
        padding: 25px 14px;
    }

    body::before {
        font-size: 22px;
        letter-spacing: 1px;
        border-width: 3px;
    }

    table {
        margin-bottom: 25px;
        border-radius: 10px;
    }

    table th {
        padding: 12px 10px;
        font-size: 11px;
    }

    table td {
        padding: 12px 10px;
        font-size: 12px;
    }

    #deletedata,
    #editdata,
    .editname,
    .editnumber,
    .editemail,
    .editpassword {
        height: 49px;
        margin: 10px auto;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 7px;
    }

    #deletedata {
        margin-bottom: 30px;
    }
}

@media (max-width: 400px) {
    body {
        padding: 20px 10px;
    }

    body::before {
        font-size: 19px;
        margin-bottom: 25px;
    }

    table th {
        font-size: 10px;
    }

    table td {
        font-size: 11px;
    }

    #deletedata,
    #editdata,
    .editname,
    .editnumber,
    .editemail,
    .editpassword {
        height: 46px;
        font-size: 12px;
    }
}
        
    </style>
    <table border="2px" cellspacing="5px" cellpadding="5px">
        <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Email</th>
            <th>Password</th>
        </tr>
    </table>

    <select name="" id="deletedata" onchange="deleteuser()">
        <option value="" selected disabled>select user for delete</option>
    </select>

    <input type="text" placeholder="enter edited name" class="editname">
    <input type="text" placeholder="enter edited number" class="editnumber">
    <input type="text" placeholder="enter edited email" class="editemail">
    <input type="text" placeholder="enter edited password" class="editpassword">
    <select name="" id="editdata" onchange="edituser()">
        <option value="" disabled selected>select user for edit</option>
    </select>
    <script>
        async function getprodcuts(){
            let apilink=await fetch("http://localhost:3000/login")
            let data=await apilink.json()
            let table=document.querySelector("table")
            let deletedata=document.querySelector("#deletedata")
            let editdata=document.querySelector("#editdata")
            for(let i=0;i<data.length;i++){
                table.innerHTML+=`
                <tr>
                   <td>${data[i].name}</td>
                   <td>${data[i].number}</td>
                   <td>${data[i].email}</td>
                   <td>${data[i].password}</td> 
                </tr>
                `
                deletedata.innerHTML+=`
                <option value="${data[i].id}">${data[i].name}</option>
                `
                editdata.innerHTML+=`
                <option value="${data[i].id}">${data[i].name}</option>
                `
            }
        }

        getprodcuts()

        async function deleteuser(){
            let deletedata=document.querySelector("#deletedata").value;
            if(window.confirm("are you sure to delete user")){
            let apilink=await fetch(`http://localhost:3000/login/${deletedata}`,{
            method:"DELETE"
            })
            alert("user deleted successfully")
            window.location.reload()
            }
        }

        async function edituser(){
            let editdata=document.querySelector("#editdata").value;
            let editname=document.querySelector(".editname").value;
            let editnumber=document.querySelector(".editnumber").value;
            let editemail=document.querySelector(".editemail").value;
            let editpassword=document.querySelector(".editpassword").value;

           if(window.confirm("are you sure to edit data")){
              let apilink=await fetch(`http://localhost:3000/login/${editdata}`,{
                method:"PATCH",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({name:editname,number:editnumber,email:editemail,password:editpassword})
            })
            alert("data updated successfully")
            window.location.reload()
            }
            }
    </script>


    
</body>
</html>
